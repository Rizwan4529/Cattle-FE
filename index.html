<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ranch-direct beef cattle. Every animal tagged, scanned, and verified." />
    <title>Ranch-direct cattle</title>
    <script>
      // Apply the saved light/dark preference before first paint to avoid a flash.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('ranch-preferences') || '{}')
          var theme = (saved.state && saved.state.theme) || 'system'
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
