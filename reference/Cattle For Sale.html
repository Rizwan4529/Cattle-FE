<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cattle For Sale</title>
<style>
:root{--bg:#f2f2f0;--card:#fff;--text:#1d1d1b;--muted:#5d5d58;--red:#a8321f;--navy:#173a63;--line:#ddd;--img:#d9d2bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#232321;--text:#efefea;--muted:#a5a59d;--red:#d4513d;--navy:#2a5c96;--line:#3a3a36;--img:#3b372b}}
:root[data-theme="dark"]{--bg:#161615;--card:#232321;--text:#efefea;--muted:#a5a59d;--red:#d4513d;--navy:#2a5c96;--line:#3a3a36;--img:#3b372b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}
.count{color:var(--red);font-weight:600;margin:0 0 12px}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--text);padding:9px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:130px 1fr;gap:12px}
.pic{background:var(--img);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:56px;min-height:120px}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.badge.site{background:#b8860b}
.lot{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
h2{font-size:17px;margin:2px 0}
.sub{font-size:14px;color:var(--muted);margin:0 0 6px}
.bid{font-size:14px}.bid b{font-size:19px}
.meta{font-size:14px;margin:8px 0 0;color:var(--muted)}.meta b{color:var(--text)}
.row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:90px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.btn{border:0;border-radius:6px;padding:10px 14px;font:inherit;font-weight:700;color:#fff;background:var(--red);cursor:pointer}
.btn.alt{background:var(--navy)}
a.btn{text-decoration:none;display:inline-block}
.msg{grid-column:1/-1;font-size:13px;color:var(--red);min-height:0;margin:0}
.seller{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--muted)}
@media(max-width:400px){.card{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Cattle For Sale</h1>
<p class="count" id="count"></p>
<div class="tabs" id="tabs">
<button class="on" data-f="all">All</button><button data-f="online">Online</button><button data-f="site">On-Site</button>
</div>
<div id="list"></div>
</main>
<script>
var items=[
{lot:3498,type:"online",live:true,title:"20 Angus, Red Angus – Cows",sub:"Commercial beef cattle",bid:550,head:20,bids:18,time:"9 days 21 hours",loc:"El Dorado Springs, Missouri",seller:"Rafter LF Cattle Company",phone:"(555) 010-4521",icon:"🐄"},
{lot:8730,type:"online",title:"12 Hereford – Bred Heifers",sub:"Bred heifers, spring calving",bid:1450,head:12,bids:7,time:"5 days 3 hours",loc:"Macon, Missouri",seller:"Bull Family Farms",phone:"(555) 010-6211",icon:"🐂"},
{lot:2210,type:"site",title:"8 Black Angus – Stocker Steers",sub:"Weaned, 550 lb avg.",bid:1100,head:8,bids:0,time:"Sale Saturday 10:00 AM",loc:"Sedalia, Missouri",seller:"Cedar Creek Ranch",phone:"(555) 010-7788",icon:"🐃"},
{lot:5164,type:"online",title:"3 Charolais – Herd Bulls",sub:"Registered, semen tested",bid:3200,head:3,bids:11,time:"2 days 8 hours",loc:"Joplin, Missouri",seller:"Prairie Gate Livestock",phone:"(555) 010-3390",icon:"🐂"}
];
var filter="all",list=document.getElementById("list");
function money(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
 var shown=items.filter(function(i){return filter==="all"||i.type===filter});
 document.getElementById("count").textContent="1 – "+shown.length+" of "+shown.length+" listings";
 list.innerHTML=shown.map(function(i){
  var online=i.type==="online";
  return '<article class="card"><div class="pic">'+i.icon+'</div><div>'+
  '<div class="lot">LOT # '+i.lot+' <span class="badge'+(online?'':' site')+'">'+(i.live?'LIVE':online?'Online':'On-Site')+'</span></div>'+
  '<h2>'+i.title+'</h2><p class="sub">'+i.sub+'</p>'+
  '<div class="bid">Current bid: <b id="b'+i.lot+'">'+money(i.bid)+'</b> / head × '+i.head+' head</div>'+
  '<p class="meta"><b>Bids:</b> '+i.bids+'<br><b>Time:</b> '+i.time+'<br><b>Location:</b> '+i.loc+'</p></div>'+
  (online?'<div class="row"><input type="number" inputmode="decimal" placeholder="Max bid ($/head)" id="in'+i.lot+'"><button class="btn" onclick="bid('+i.lot+')">Place Bid</button></div><p class="msg" id="m'+i.lot+'"></p>':'')+
  '<div class="row"><a class="btn alt" href="tel:'+i.phone.replace(/\D/g,"")+'">Call Seller</a><button class="btn alt" onclick="alert(\'Shipping quotes coming soon\')">Shipping Quote</button></div>'+
  '<div class="seller">Seller: '+i.seller+' · '+i.phone+'</div></article>';
 }).join("");
}
function bid(lot){
 var it=items.filter(function(x){return x.lot===lot})[0],inp=document.getElementById("in"+lot),m=document.getElementById("m"+lot),v=parseFloat(inp.value);
 if(!(v>it.bid)){m.textContent="Bid must be higher than "+money(it.bid)+".";return}
 it.bid=v;it.bids++;render();
}
document.getElementById("tabs").addEventListener("click",function(e){
 if(!e.target.dataset.f)return;filter=e.target.dataset.f;
 Array.prototype.forEach.call(this.children,function(b){b.classList.toggle("on",b===e.target)});render();
});
render();
</script>
</body>
</html>
